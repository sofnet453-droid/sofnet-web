<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro | Sofnet</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

:root {
    --primary:#4e73df;
    --glass:rgba(255,255,255,0.15);
    --text:#fff;
}

@media (prefers-color-scheme: light) {
    :root {
        --glass:rgba(255,255,255,0.6);
        --text:#000;
    }
}

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#4e73df,#1cc88a);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.card{
    backdrop-filter:blur(15px);
    background:var(--glass);
    padding:40px;
    width:380px;
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
    color:var(--text);
    animation:fade 0.6s ease;
}

@keyframes fade{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

h2{text-align:center;}

.input-group{
    position:relative;
    margin:15px 0;
}

.input-group i{
    position:absolute;
    left:12px;
    top:12px;
    color:#888;
}

input{
    width:100%;
    padding:12px 12px 12px 35px;
    border:none;
    border-radius:10px;
    outline:none;
}

.strength{
    height:5px;
    border-radius:5px;
    margin-top:5px;
    transition:0.3s;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:var(--primary);
    color:white;
    font-weight:bold;
    cursor:pointer;
    position:relative;
    overflow:hidden;
}

button.loading{
    pointer-events:none;
    opacity:0.7;
}

.spinner{
    border:3px solid rgba(255,255,255,0.3);
    border-top:3px solid white;
    border-radius:50%;
    width:18px;
    height:18px;
    animation:spin 1s linear infinite;
    margin:auto;
}

@keyframes spin{
    0%{transform:rotate(0);}
    100%{transform:rotate(360deg);}
}

.google-btn{
    margin-top:15px;
    background:white;
    color:#444;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
}

.google-btn img{width:18px;}

.back-btn{
    margin-top:15px;
    text-align:center;
    display:block;
    text-decoration:none;
    color:var(--text);
    opacity:0.8;
}

.back-btn:hover{opacity:1;}

</style>
</head>

<body>

<div class="card">
<h2>Crear Cuenta</h2>

<form method="POST" id="form">

<div class="input-group">
<i class="fa fa-user"></i>
<input type="text" name="username" placeholder="Usuario" required>
</div>

<div class="input-group">
<i class="fa fa-envelope"></i>
<input type="email" name="email" placeholder="Correo electrónico" required>
</div>

<div class="input-group">
<i class="fa fa-lock"></i>
<input type="password" id="password" placeholder="Contraseña" required>
<div class="strength" id="strength"></div>
</div>

<div class="input-group">
<i class="fa fa-lock"></i>
<input type="password" name="confirmar" placeholder="Confirmar contraseña" required>
</div>

<button id="btn">Registrarse</button>

</form>

<button class="google-btn" onclick="window.location.href='{{ url_for('login_google') }}'">
<img src="https://developers.google.com/identity/images/g-logo.png">
Registrarse con Google
</button>

<a href="{{ url_for('login') }}" class="back-btn">
<i class="fa fa-arrow-left"></i> Volver al login
</a>

</div>

<script>

const password=document.getElementById("password");
const strength=document.getElementById("strength");

password.addEventListener("input",()=>{
    let val=password.value.length;
    if(val<4){
        strength.style.background="red";
        strength.style.width="30%";
    }else if(val<8){
        strength.style.background="orange";
        strength.style.width="60%";
    }else{
        strength.style.background="green";
        strength.style.width="100%";
    }
});

const form=document.getElementById("form");
const btn=document.getElementById("btn");

form.addEventListener("submit",()=>{
    btn.classList.add("loading");
    btn.innerHTML='<div class="spinner"></div>';
});

</script>

</body>
</html>

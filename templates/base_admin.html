<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Administrativo</title>

    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="sidebar">
    <div class="logo-container">
        <img src="{{ url_for('static', filename='img/logo.png') }}" class="logo">
    </div>

    <a href="{{ url_for('dashboard_admin') }}">📊 Dashboard</a>
    <a href="{{ url_for('admin_usuarios') }}">👥 Usuarios</a>
    <a href="{{ url_for('admin_roles') }}">🛡 Roles</a>
    <a href="{{ url_for('admin_mensajes') }}">📩 Mensajes</a>
    <a href="{{ url_for('admin_configuracion') }}">⚙ Configuración</a>
    <a href="{{ url_for('logout') }}">🚪 Cerrar sesión</a>
</div>

<div class="content">
    {% block content %}{% endblock %}
</div>

</body>
</html>

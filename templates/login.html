{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<section class="login">
    <h2>Iniciar sesión</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alerta">
            {{ messages[0] }}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="text" name="username" placeholder="Usuario" required>
        <input type="password" name="password" placeholder="Contraseña" required>
        <button type="submit">Entrar</button>
    </form>

    <p>¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate aquí</a></p>
</section>

<!-- Audio de bienvenida -->
<audio id="audio_welcome" src="{{ url_for('static', filename='welcome.mp3') }}"></audio>

<script>
window.onload = function() {
    var audio = document.getElementById("audio_welcome");
    if(audio) audio.play().catch(e => console.log("Autoplay bloqueado, click para escuchar"));
}
</script>

{% endblock %}

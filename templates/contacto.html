<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto | SOFNET</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- FAVICON -->
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" type="image/x-icon">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}" type="image/x-icon">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<header>
    <div class="logo">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="SOFNET Logo" class="logo-img">
    </div>
    
    
    <!-- BOTON HAMBURGUESA -->
    <div class="menu-toggle" id="menu-toggle">
        <i class="fa-solid fa-bars"></i>
    </div>

     <!-- BOTON MODO OSCURO -->
    <div class="dark-toggle" id="dark-toggle">
        <i class="fa-solid fa-moon"></i>
    </div>

    <nav>
        <a href="/">Inicio</a>
        <a href="/servicios">Servicios</a>
        <a href="/nosotros">Nosotros</a>
        <a href="/contacto">Contacto</a>
    </nav>
</header>

<section class="contacto">
    <h2>Contáctanos</h2>

    <form action="/enviar" method="post">
        <input type="text" name="nombre" placeholder="Tu nombre" required>
        <input type="email" name="email" placeholder="Tu correo" required>
        <textarea name="mensaje" placeholder="Tu mensaje" required></textarea>
        <button type="submit">Enviar</button>
    </form>
</section>

<!-- WHATSAPP -->
<a href="https://wa.me/593984098439" class="whatsapp" target="_blank">
    <i class="fa-brands fa-whatsapp"></i>
</a>

<footer>
    <p>© 2026 SOFNET - Todos los derechos reservados</p>
</footer>

 <!-- SCRIPT HAMBURGUESA -->
    <script>
        const toggle = document.getElementById("menu-toggle");
        const nav = document.getElementById("nav");

        toggle.addEventListener("click", () => {
            nav.classList.toggle("active");

            if(nav.classList.contains("active")){
                toggle.innerHTML = '<i class="fa-solid fa-xmark"></i>';
            } else {
                toggle.innerHTML = '<i class="fa-solid fa-bars"></i>';
            }
        });
    </script>
    <!-- SCRIPT MODO OSCURO -->
<script>
const darkToggle = document.getElementById("dark-toggle");
const body = document.body;

// Cargar preferencia guardada
if(localStorage.getItem("modo") === "oscuro"){
    body.classList.add("dark-mode");
    darkToggle.innerHTML = '<i class="fa-solid fa-sun"></i>';
}

darkToggle.addEventListener("click", () => {
    body.classList.toggle("dark-mode");

    if(body.classList.contains("dark-mode")){
        darkToggle.innerHTML = '<i class="fa-solid fa-sun"></i>';
        localStorage.setItem("modo", "oscuro");
    } else {
        darkToggle.innerHTML = '<i class="fa-solid fa-moon"></i>';
        localStorage.setItem("modo", "claro");
    }
});


</body>
</html>

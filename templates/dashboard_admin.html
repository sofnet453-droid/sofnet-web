{% extends "base_admin.html" %}

{% block content %}

<h1>Dashboard Ejecutivo</h1>
<p>Bienvenido {{ usuario }}</p>

<div class="card">
    <h3>Total Mensajes</h3>
    <p>{{ mensajes|length }}</p>
</div>

<div class="card">
    <h3>Actividad Reciente</h3>
    <ul>
        {% for mensaje in mensajes %}
            <li>{{ mensaje.nombre }} - {{ mensaje.mensaje }}</li>
        {% endfor %}
    </ul>
</div>

{% endblock %}
